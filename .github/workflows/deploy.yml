name: Build al-folio and publish to main

on:
  push:
    branches:
      - al-folio-source
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: false

      - name: Install dependencies
        run: bundle install

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Publish generated site to main
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          folder: _site
          clean: true
          single-commit: true
