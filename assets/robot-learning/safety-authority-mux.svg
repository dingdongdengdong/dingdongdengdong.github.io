<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Single-owner robot command authority</title>
  <desc id="desc">Quest teleoperation and the learned policy submit commands to a single HOLD, POLICY, or TELEOP authority mux before the physical bridge and motors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111512"/><stop offset="1" stop-color="#19201b"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#315cff"/><stop offset="1" stop-color="#6b87ff"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#78847c"/></marker>
    <style>.k{font:800 17px ui-sans-serif,system-ui,sans-serif;letter-spacing:.13em;fill:#839189}.h{font:760 34px ui-sans-serif,system-ui,sans-serif;fill:#f4f5f1}.p{font:520 18px ui-sans-serif,system-ui,sans-serif;fill:#abb5ae}.pw{font:520 18px ui-sans-serif,system-ui,sans-serif;fill:#eef1ff}.s{font:700 17px ui-sans-serif,system-ui,sans-serif;fill:#eef1ed}.m{font:700 15px ui-monospace,SFMono-Regular,monospace;fill:#c7d0ca}.line{stroke:#78847c;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <text x="90" y="98" class="k">COMMAND AUTHORITY / FAIL-CLOSED ROBOT CONTROL</text>
  <text x="90" y="156" class="h">Two producers, one physical session, explicit handoff</text>

  <g>
    <rect x="90" y="262" width="280" height="170" rx="26" fill="#202722" stroke="#465149"/><text x="126" y="318" class="k">HUMAN</text><text x="126" y="367" class="h">Quest 2</text><text x="126" y="403" class="p">pose · clutch · trigger</text>
    <rect x="90" y="506" width="280" height="170" rx="26" fill="#202722" stroke="#465149"/><text x="126" y="562" class="k">POLICY</text><text x="126" y="611" class="h">Echo Flow Lite</text><text x="126" y="647" class="p">action chunks · heartbeat</text>
  </g>
  <path d="M370 347H514V424H565" class="line"/><path d="M370 591H514V514H565" class="line"/>

  <rect x="590" y="244" width="390" height="450" rx="32" fill="url(#blue)"/>
  <text x="634" y="305" class="k" fill="#e1e6ff">SINGLE OWNER</text><text x="634" y="355" class="h">Authority mux</text>
  <rect x="634" y="402" width="302" height="62" rx="18" fill="#fff" opacity=".18"/><text x="665" y="442" class="s">HOLD</text><text x="874" y="442" class="m">safe default</text>
  <rect x="634" y="482" width="302" height="62" rx="18" fill="#fff" opacity=".13"/><text x="665" y="522" class="s">TELEOP</text><text x="830" y="522" class="m">human owns</text>
  <rect x="634" y="562" width="302" height="62" rx="18" fill="#fff" opacity=".13"/><text x="665" y="602" class="s">POLICY</text><text x="830" y="602" class="m">model owns</text>
  <text x="634" y="658" class="pw">Every transfer: measured-position HOLD → acknowledge → rearm</text>

  <path d="M980 469H1052" class="line"/>
  <rect x="1080" y="302" width="220" height="330" rx="28" fill="#202722" stroke="#465149"/>
  <text x="1116" y="358" class="k">PHYSICAL BRIDGE</text><text x="1116" y="407" class="h">20 Hz</text><text x="1116" y="445" class="p">limits · signs · gains</text><text x="1116" y="477" class="p">watchdog · CAN</text>
  <path d="M1140 536h102M1140 566h72" stroke="#315cff" stroke-width="12" stroke-linecap="round"/>
  <path d="M1300 469H1360" class="line"/>
  <rect x="1382" y="334" width="128" height="270" rx="28" fill="#202722" stroke="#465149"/>
  <text x="1446" y="384" class="k" text-anchor="middle">ROBOT</text>
  <circle cx="1446" cy="438" r="30" fill="#315cff"/><rect x="1436" y="462" width="20" height="74" rx="10" fill="#62706a" transform="rotate(28 1446 462)"/><circle cx="1464" cy="529" r="21" fill="#315cff"/><path d="M1476 541l22 27M1452 542l-10 34" stroke="#cbd2cd" stroke-width="11" stroke-linecap="round"/>
  <text x="1446" y="580" class="m" text-anchor="middle">5 DoF + grip</text>

  <rect x="90" y="756" width="1420" height="70" rx="22" fill="#202722" stroke="#465149"/>
  <text x="122" y="799" class="s">Stale image</text><text x="323" y="799" class="s">State timeout</text><text x="551" y="799" class="s">Missed heartbeat</text><text x="814" y="799" class="s">Invalid number</text><text x="1049" y="799" class="s">Disconnect</text><text x="1254" y="799" class="s" fill="#9fb0ff">→ HOLD, never auto-switch</text>
</svg>
