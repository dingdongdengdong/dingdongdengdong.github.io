title: Dongje Lee
first_name: Dongje
middle_name:
last_name: Lee
contact_note: >
  Open to research collaboration, robotics engineering, and ambitious product work.
description: >
  Robotics engineer, embodied AI researcher, and entrepreneur working across robot learning, manipulation, sim-to-real, and real-world robotics products.
footer_text: >
  Built with <a href="https://github.com/alshedivat/al-folio" target="_blank">al-folio</a> and hosted on GitHub Pages.
keywords: robotics, embodied ai, robot learning, physical ai, sim-to-real, entrepreneur, engineer
lang: en
icon: 🤖
url: https://dingdongdengdong.github.io
baseurl:
last_updated: false
back_to_top: false

repo_theme_light: default
repo_theme_dark: dark
protect_email: false

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0

navbar_fixed: true
footer_fixed: false
search_enabled: false
socials_in_search: false
posts_in_search: false
bib_search: false
max_width: 930px
serve_og_meta: true
serve_schema_org: true

blog_name: Notes
blog_description: Robotics, AI, engineering, and building products.
permalink: /blog/:year/:title/

collections:
  projects:
    output: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

include: ["_pages"]
exclude:
  - Gemfile
  - README.md
  - LICENSE
keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core
plugins:
  - jekyll-cache-bust
  - jekyll-regex-replace
  - jekyll/scholar
  - al_folio_core

sass:
  style: compressed

scholar:
  last_name: [Lee]
  first_name: [Dongje]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false
filtered_bibtex_keywords: [abbr, abstract, additional_info, award, award_name, bibtex_show, code, html, pdf, selected, video, website]
max_author_limit: 8
more_authors_animation_delay: 10
enable_publication_thumbnails: false

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank

enable_google_verification: false
enable_bing_verification: false
enable_cookie_consent: false
enable_masonry: false
enable_math: false
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: true
enable_medium_zoom: false
enable_progressbar: false
enable_video_embedding: false

newsletter:
  enabled: false

third_party_libraries:
  google_fonts:
    url:
      fonts: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap"
